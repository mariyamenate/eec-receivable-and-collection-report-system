name: eec_receivable_and_collection_report_system
description: EEC Receivable and Collection Report System — multi-role app with EN/AM support
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  get: ^4.6.6
  shared_preferences: ^2.2.3
  intl: any
  record: ^5.1.0
  audioplayers: ^6.0.0
  file_picker: ^8.0.0
  fl_chart: ^0.68.0
  excel: ^4.0.6
  file_saver: ^0.2.14
  path_provider: ^2.1.2
  url_launcher: ^6.2.0
  permission_handler: ^11.0.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/EEC.jpg